services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smorg
      POSTGRES_PASSWORD: smorg
      POSTGRES_DB: smorg
    ports:
      - '5432:5432'
    volumes:
      - smorg_pg:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  smorg_pg:
